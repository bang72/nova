[workspace]
resolver = "2"
members = [
  "crates/nova-primitives",
  "crates/nova-crypto",
  "crates/nova-monetary",
  "crates/nova-state",
  "crates/nova-consensus",
  "crates/nova-staking",
  "crates/nova-genesis",
  "crates/nova-node",
  "crates/nova-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
