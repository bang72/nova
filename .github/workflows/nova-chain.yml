name: NOVA Chain

on:
  push:
    paths:
      - "chain/**"
      - ".github/workflows/nova-chain.yml"
  pull_request:
    paths:
      - "chain/**"
      - ".github/workflows/nova-chain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
